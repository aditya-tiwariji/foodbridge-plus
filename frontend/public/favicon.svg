<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Emerald Green to Amber Orange Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle background (transparent outside the circle) -->
  <circle cx="256" cy="256" r="240" fill="url(#brandGrad)" />
  
  <!-- White Minimalist Food Bowl & Heart Symbol (High legibility, thick lines) -->
  <g fill="#ffffff" transform="translate(120, 110)">
    <!-- Steam waves forming a soft heart/bridge -->
    <path d="M 60 50 Q 80 15 100 50 T 140 50" stroke="#ffffff" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 130 50 Q 150 15 170 50 T 210 50" stroke="#ffffff" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.9" />
    
    <!-- Bowl body -->
    <path d="M 20 130 C 20 250, 250 250, 250 130 Z" />
    <!-- Bowl base/stand -->
    <path d="M 70 240 L 200 240 L 180 270 L 90 270 Z" opacity="0.9" />
  </g>
  
  <!-- Small integrated plus sign (+) in upper right of circular badge -->
  <g transform="translate(320, 80)">
    <circle cx="60" cy="60" r="45" fill="#ffffff" />
    <path d="M 60 35 L 60 85 M 35 60 L 85 60" stroke="#059669" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
